command.memory.description=查看此聊天中智能体的长期记忆；管理员还可以搜索记忆、让它立即进入睡眠。
usage.memory=发送 /memory 或 /memory status 查看记忆，/memory search 加上要回想的内容进行搜索，或 /memory sleep 立即整理记忆。
memory.operators_only=只有管理员可以运行 /memory {action}。
memory.busy=记忆正在处理其他工作，请稍后再试。
memory.unavailable=暂时无法访问 {agent} 的记忆，原因见日志。
memory.status={agent} 的记忆：{engrams} 条记忆，{edges} 条关联，{entities} 个实体，{scenes} 个场景，{periods} 个时期。
memory.status_embedding=向量：{model}，{dimension} 维。
memory.status_no_embedding=向量：尚无，因为还没有存下任何记忆。
memory.status_last_sleep=上次睡眠：{time}，记忆从 {before} 条变为 {after} 条。
memory.status_never_slept=自 Alexandrite 启动以来还没有睡眠过。
memory.status_next_sleep=下次睡眠：{time}。
memory.status_sleep_off=夜间睡眠已关闭。
memory.search_empty=记忆中没有匹配的内容。
memory.search_tainted=其中有些记忆来自读取过不受信任内容的回合。
memory.sleep_started={agent} 的记忆开始睡眠。完成后可以用 /memory status 查看结果。
memory.sleep_running=已经有一次睡眠在进行中，请等它结束后再试。
