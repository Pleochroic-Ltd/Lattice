command.memory.description=Shows the long-term memory of this chat's agent; operators also search it and put it to sleep.
usage.memory=Send /memory or /memory status to see the memory, /memory search followed by what to recall, or /memory sleep to consolidate it now.
memory.operators_only=Only an operator may run /memory {action}.
memory.busy=The memory is busy with other work. Try again in a moment.
memory.unavailable=The memory of {agent} cannot be reached now. The log says why.
memory.status=Memory of {agent}: {engrams} memories, {edges} links, {entities} entities, {scenes} scenes, {periods} periods.
memory.status_embedding=Embeddings: {model}, {dimension} dimensions.
memory.status_no_embedding=Embeddings: none yet, as nothing is stored.
memory.status_last_sleep=Last sleep: {time}, from {before} memories to {after}.
memory.status_never_slept=It has not slept since Alexandrite started.
memory.status_next_sleep=Next sleep: {time}.
memory.status_sleep_off=The nightly sleep is off.
memory.search_empty=Nothing in memory matches.
memory.search_tainted=Some of these memories come from turns that read untrusted content.
memory.sleep_started=The memory of {agent} is going to sleep. /memory status shows how it went once it is done.
memory.sleep_running=A sleep is running already. Wait for it to finish, then try again.
